[supervisord]
nodaemon=true
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:fix-permissions]
command=mkdir -p /var/log/supervisor && chown -R www:www /var/log/supervisor && chown -R www:www /var/www/html/storage/ && chmod -R 775 /var/www/html/storage/ && chown -R www:www /var/www/html/public/storage 2>/dev/null || true && chmod -R 775 /var/www/html/public/storage 2>/dev/null || true
directory=/var/www/html
user=root
autostart=true
autorestart=false
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/fix-permissions.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:php-fpm]
command=php-fpm -F
directory=/var/www/html
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/php-fpm.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10



[program:laravel-schedule]
command=php artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/laravel-schedule.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10


[program:queue-worker]
command=php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
user=www
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10