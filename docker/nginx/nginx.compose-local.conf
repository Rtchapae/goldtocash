# Local-only stack (docker-compose.local-full.yml): Docker DNS service names, no goldtocash_* container_name.
# Site: http://127.0.0.1:9080/   Admin (Vite): http://127.0.0.1:9082/   API: /api/v1   Adminer: http://127.0.0.1:9083/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    client_max_body_size 100M;

    upstream backend {
        server backend:9000;
    }

    upstream front {
        server front:5175;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1 _;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        location /api/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_pass backend;
        }

        # Legacy contact form (POST /sendmail)
        location = /sendmail {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI /sendmail;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_pass backend;
        }

        location = /up {
            access_log off;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI /up;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_pass backend;
        }

        location ^~ /storage/ {
            alias /var/www/html/storage/app/public/;
            try_files $uri =404;
        }

        location ~* ^/(css|js|build|favicon\.ico|robots\.txt) {
            root /var/www/html/public;
            try_files $uri =404;
        }

        location /images/ {
            proxy_pass http://front/images/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            proxy_pass http://front/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://front/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }
    }
}
