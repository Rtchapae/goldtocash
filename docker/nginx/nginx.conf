user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

# Upstream для backend
upstream backend {
    server goldtocash_backend:9000;
}

# Upstream для frontend
upstream front {
    server goldtocash_front:5175;
}

# Upstream для admin frontend
upstream front_admin {
    server goldtocash_admin:5173;
}

    # Основной сервер
    server {
        listen 80;
        server_name goldtocash.us;
        #server_name base.goldtocash.us;

        # API Backend (все API запросы)
        location /api/ {
            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_pass backend;
        }

        # Storage files (serve from backend storage without relying on symlink)
        location ^~ /storage/ {
            alias /var/www/html/storage/app/public/;
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Статические файлы для backend (CSS, JS, изображения)
        #location ~* ^/(css|js|build|storage|favicon\.ico|robots\.txt) {
        location ~* ^/(css|js|build|favicon\.ico|robots\.txt) {
            root /var/www/html/public;
            try_files $uri =404;

            # Кэширование статики
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Frontend images (static assets)
        location /images/ {
            proxy_pass http://front/images/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Кэширование изображений
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Frontend assets (bundled JS/CSS for SSR)
        location /assets/ {
            proxy_pass http://front/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Кэширование assets
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Frontend App (по умолчанию)
        location / {
            proxy_pass http://front/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Увеличенные таймауты для SSR
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Admin Panel Server (port 8082)
    server {
        listen 80;
        server_name m.goldtocash.us;

        # API Backend (все API запросы для админки)
        location /api/ {
            # CORS headers для админки
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_pass backend;
        }

        # Admin Panel (root path for port 8082)
        location / {
            proxy_pass http://front_admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket поддержка для hot reload
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Таймауты для WebSocket
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Health check for admin
        location /health {
            access_log off;
            return 200 "admin-healthy\n";
            add_header Content-Type text/plain;
        }
    }
}